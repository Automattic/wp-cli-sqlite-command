name: Testing

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
  # The shared workflow runs its allowed-to-fail jobs (macOS, MariaDB, PHP nightly) only on scheduled and manual runs.
  schedule:
    - cron: "17 1 * * *"

jobs:
  test:
    uses: wp-cli/.github/.github/workflows/reusable-testing.yml@c819f58d5eb141a15043a762e4a6099941cc8ea6 # main
    with:
      minimum-php: "7.4"
      matrix: '{ "exclude": [{ "os": "windows-2022" }] }'
